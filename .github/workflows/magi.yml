name: magi

on:
  push:
    branches: [main, dev, omm]
  pull_request:
    branches: [main, dev, omm]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin:
    name: oh-my-magi (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        opencode: ["1.18.29", "latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Plugin behavioral tests
        run: bun test
        working-directory: packages/oh-my-magi
      - name: Current SDK typecheck
        run: bun typecheck
        working-directory: packages/oh-my-magi
      - name: Build publishable plugin
        run: bun run build
        working-directory: packages/oh-my-magi
      - name: Pack public artifact
        run: bun pm pack
        working-directory: packages/oh-my-magi
      - name: Current OpenCode server smoke
        run: bun run smoke
        working-directory: packages/oh-my-magi
        env:
          MAGI_OPENCODE_VERSION: ${{ matrix.opencode }}

  core:
    name: core checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Magi core tests
        run: bun --cwd packages/magi test

      - name: Magi core typecheck
        run: bun --cwd packages/magi typecheck

      - name: Magi HTTP API regression
        run: bun --cwd packages/opencode test test/server/httpapi-magi.test.ts
