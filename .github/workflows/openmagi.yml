name: oh-my-magi continuous runtime

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: openmagi-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.os }} / OpenCode ${{ matrix.opencode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        opencode: ["1.18.29", "latest"]
    defaults:
      run:
        working-directory: packages/oh-my-openmagi
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .
      - run: bun typecheck
      - run: bun run test
      - run: bun run pack:check
      - run: bun script/audit.ts
      - name: Resolve the native OpenCode version
        shell: bash
        env:
          REQUESTED_OPENCODE: ${{ matrix.opencode }}
        run: |
          bun -e 'const requested = process.env.REQUESTED_OPENCODE; const version = requested === "latest" ? (await (await fetch("https://registry.npmjs.org/opencode-ai/latest")).json()).version : requested; if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("Invalid OpenCode version"); console.log("OPENMAGI_OPENCODE_VERSION=" + version)' >> "$GITHUB_ENV"
      - name: Test the installed release artifact with real OpenCode and OmO
        shell: bash
        run: |
          PACKAGE_DIR=$(bun -e 'console.log((await Bun.file("artifacts/release.json").json()).installed)')
          OPENMAGI_PLUGIN_PACKAGE="$PACKAGE_DIR" bun run smoke
        env:
          OPENMAGI_SMOKE_BACKGROUND: ${{ matrix.opencode == '1.18.29' && 'true' || 'false' }}
          OPENMAGI_SMOKE_ROOT: ${{ runner.temp }}
      - name: Keep release and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmagi-${{ matrix.os }}-${{ matrix.opencode }}
          path: |
            packages/oh-my-openmagi/artifacts/release.json
            packages/oh-my-openmagi/artifacts/runs/*/manifest.json
            packages/oh-my-openmagi/artifacts/runs/*/result.json
            packages/oh-my-openmagi/artifacts/runs/*/events.jsonl
            packages/oh-my-openmagi/artifacts/runs/*/*.stdout.log
            packages/oh-my-openmagi/artifacts/runs/*/*.stderr.log
            packages/oh-my-openmagi/artifacts/runs/*/*.tgz
          if-no-files-found: ignore
