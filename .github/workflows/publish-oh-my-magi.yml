name: Publish oh-my-magi

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-oh-my-magi
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/openmagi.yml
  publish:
    needs: validation
    if: github.repository == 'eljja/Magi'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/oh-my-openmagi
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: .
      - run: bun typecheck
      - run: bun run test
      - run: bun run pack:check
      - run: bun script/audit.ts
      - run: bun run smoke
      - name: Publish reviewed package using npm trusted publishing
        run: |
          ARCHIVE=$(bun -e 'console.log((await Bun.file("artifacts/release.json").json()).archive)')
          npm publish "$ARCHIVE" --ignore-scripts --access public --provenance
      - name: Verify public registry visibility
        run: bun script/registry-check.ts
